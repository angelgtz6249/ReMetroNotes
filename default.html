<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>ReMetroNotes</title>

    <!-- Referencias WinJS 2.0 -->
    <link href="//Microsoft.WinJS.2.0/css/ui-dark.css" rel="stylesheet" />
    <script src="//Microsoft.WinJS.2.0/js/base.js"></script>
    <script src="//Microsoft.WinJS.2.0/js/ui.js"></script>

    <!-- Estilos personalizados -->
    <link href="/css/default.css" rel="stylesheet" />
</head>
<body class="theme-dark" data-lang="es">

    <!-- Franja superior libre para activar el AppBar con clic derecho -->
    <div id="topAppBarTriggerArea"></div>

    <!-- AppBar Superior con el botón Archivo a la izquierda -->
    <div id="topAppBar" data-win-control="WinJS.UI.AppBar" data-win-options="{placement: 'top', layout: 'commands'}">
        <button data-win-control="WinJS.UI.AppBarCommand"
                data-win-options="{id:'fileBtn', type:'flyout', label:'Archivo', icon:'folder', section:'left', flyout:'fileFlyout'}"></button>
    </div>

    <!-- Menú Contextual (Flyout) para Archivo -->
    <div id="fileFlyout" data-win-control="WinJS.UI.Flyout">
        <div class="menu-list">
            <button id="cmdSave" class="win-command"><span class="win-label" data-i18n="menu_save">Guardar .txt</span></button>
            <button id="cmdOpen" class="win-command"><span class="win-label" data-i18n="menu_open">Cargar .txt</span></button>
            <button id="cmdNew" class="win-command"><span class="win-label" data-i18n="menu_new">Nuevo</span></button>
            <hr />
            <button id="cmdUndo" class="win-command"><span class="win-label" data-i18n="menu_undo">Deshacer</span></button>
            <button id="cmdRedo" class="win-command"><span class="win-label" data-i18n="menu_redo">Rehacer</span></button>
            <hr />
            <button id="cmdCopy" class="win-command"><span class="win-label" data-i18n="menu_copy">Copiar</span></button>
            <button id="cmdCut" class="win-command"><span class="win-label" data-i18n="menu_cut">Cortar</span></button>
            <button id="cmdPaste" class="win-command"><span class="win-label" data-i18n="menu_paste">Pegar</span></button>
            <button id="cmdSelectAll" class="win-command"><span class="win-label" data-i18n="menu_selectall">Seleccionar todo</span></button>
            <hr />
            <button id="cmdSettingsFlyoutTrigger" class="win-command"><span class="win-label" data-i18n="menu_settings">Configuración</span></button>
            <button id="cmdExit" class="win-command"><span class="win-label" data-i18n="menu_exit">Salir</span></button>
        </div>
    </div>

    <!-- Ventana emergente (Modal) para la opción Nuevo -->
    <div id="newDialogModal" class="modal-overlay">
        <div class="modal-box">
            <p data-i18n="new_confirm_msg">¿Deseas guardar los cambios antes de crear un nuevo documento?</p>
            <div class="modal-buttons">
                <button id="btnDialogYes" class="win-button" data-i18n="btn_yes">Sí</button>
                <button id="btnDialogNo" class="win-button" data-i18n="btn_no">No</button>
                <button id="btnDialogCancel" class="win-button" data-i18n="btn_cancel">Cancelar</button>
            </div>
        </div>
    </div>

    <!-- Página de Configuración Integrada para la Charms Bar -->
    <div id="settingsFlyout" data-win-control="WinJS.UI.SettingsFlyout" data-win-options="{settingsCommandId:'settingsCommand', width:'wide'}">
        <!-- Cabecera Naranja Oficial de Charms Bar -->
        <div class="win-header">
            <button type="button" onclick="WinJS.UI.Animation.hidePopup(document.getElementById('settingsFlyout'))" class="win-backbutton"></button>
            <div class="win-label" data-i18n="settings_title">Configuración</div>
        </div>
        <!-- Cuerpo Blanco -->
        <div class="win-content" style="background-color: #ffffff !important; color: #000000 !important; padding: 20px; height: calc(100% - 80px); overflow-y: auto;">

            <!-- SECCIÓN GENERAL -->
            <h3 data-i18n="sec_general" style="color: #d35400; border-bottom: 1px solid #d35400; padding-bottom: 4px;">General</h3>
            <div class="setting-item" style="margin-top: 10px;">
                <button id="btnFormat" class="win-button" data-i18n="format_btn">Formatear texto</button>
            </div>
            <label class="setting-item" style="display:block; margin-top:8px;">
                <input type="checkbox" id="chkWordWrap" checked /> <span data-i18n="wrap">Ajuste de línea</span>
            </label>
            <label class="setting-item" style="display:block; margin-top:8px;">
                <input type="checkbox" id="chkSpellCheck" /> <span data-i18n="spellcheck">Corrector ortográfico</span>
            </label>
            <label class="setting-item" style="display:block; margin-top:8px;">
                <input type="checkbox" id="chkAutoCorrect" /> <span data-i18n="autocorrect">Autocorrector</span>
            </label>
            <label class="setting-item" style="display:block; margin-top:8px;">
                <input type="checkbox" id="chkAutoSave" checked /> <span data-i18n="autosave">Autoguardado</span>
            </label>

            <div class="setting-group" style="margin-top: 15px;">
                <label data-i18n="lang" style="display:block; font-weight:bold;">Idioma:</label>
                <select id="selectLang" class="win-dropdown" style="width: 100%; margin-top: 4px;">
                    <option value="es">Español (Por defecto)</option>
                    <option value="en">English</option>
                    <option value="ru">Русский</option>
                    <option value="eo">Esperanto</option>
                </select>
            </div>

            <div class="setting-group" style="margin-top: 15px;">
                <label data-i18n="theme" style="display:block; font-weight:bold;">Tema:</label>
                <select id="selectTheme" class="win-dropdown" style="width: 100%; margin-top: 4px;">
                    <option value="dark">Oscuro (Por defecto)</option>
                    <option value="light">Claro</option>
                    <option value="amoled">Negro AMOLED</option>
                    <option value="liquid">Liquid Glass</option>
                </select>
            </div>

            <!-- SECCIÓN FUENTE -->
            <h3 data-i18n="sec_font" style="color: #d35400; border-bottom: 1px solid #d35400; padding-bottom: 4px; margin-top: 25px;">Fuente</h3>
            <div class="setting-group" style="margin-top: 15px;">
                <label data-i18n="font_family" style="display:block; font-weight:bold;">Familia de fuente:</label>
                <select id="selectFontFamily" class="win-dropdown" style="width: 100%; margin-top: 4px;">
                    <option value="Consolas">Consolas</option>
                    <option value="Arial">Arial</option>
                    <option value="Noto Sans">Noto Sans</option>
                    <option value="Times New Roman">Times New Roman</option>
                </select>
            </div>

            <div class="setting-group" style="margin-top: 15px;">
                <label data-i18n="font_size" style="display:block; font-weight:bold;">Tamaño de fuente:</label>
                <select id="selectFontSize" class="win-dropdown" style="width: 100%; margin-top: 4px;">
                    <option value="11px">11 px</option>
                    <option value="22px">22 px</option>
                    <option value="33px" selected>33 px</option>
                    <option value="44px">44 px</option>
                </select>
            </div>

            <div class="setting-group" style="margin-top: 15px;">
                <label data-i18n="font_weight" style="display:block; font-weight:bold;">Tipografía:</label>
                <select id="selectFontWeight" class="win-dropdown" style="width: 100%; margin-top: 4px;">
                    <option value="normal">Normal</option>
                    <option value="300">Delgada</option>
                    <option value="bold">Negrita</option>
                    <option value="900">Negra</option>
                </select>
            </div>

            <!-- SECCIÓN AVANZADO -->
            <h3 data-i18n="sec_advanced" style="color: #d35400; border-bottom: 1px solid #d35400; padding-bottom: 4px; margin-top: 25px;">Avanzado</h3>
            <div class="setting-item" style="margin-top: 10px;">
                <button id="btnAdvancedTools" class="win-button" data-i18n="adv_tools">Herramientas de escritura avanzada</button>
            </div>

            <!-- SECCIÓN ACERCA DE -->
            <h3 data-i18n="sec_about" style="color: #d35400; border-bottom: 1px solid #d35400; padding-bottom: 4px; margin-top: 25px;">Acerca de</h3>
            <div class="about-section" style="margin-top: 10px; font-size: 14px; color: #333333;">
                <p><strong>ReMetroNotes</strong></p>
                <p data-i18n="version">Versión 1.0</p>
                <p data-i18n="developer">Desarrollado por ReMetroSoftware.</p>
            </div>
        </div>
    </div>

    <!-- Área Principal de Edición -->
    <div id="editor-container">
        <textarea id="textArea" placeholder="Escribe tus notas aquí..." spellcheck="false"></textarea>
    </div>

    <script src="/js/default.js"></script>
</body>
</html>
